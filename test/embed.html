.msk-payment-embed {

  background: transparent;
  padding: 0;
  margin: 0;
  width: 100%;

  display: block;
}

@media (min-width: 992px) {
  .msk-payment-embed {
    margin: 48px auto;
    width: calc(100% - 96px);
    max-width: 450px;
  }
}

@media (max-width: 991px) {
  .msk-payment-embed {
    margin: 0 auto;
    width: 100%;
    max-width: 100%;
  }
}

.msk-payment-embed *,
.msk-payment-embed *::before,
.msk-payment-embed *::after {
  box-sizing: border-box;
}

.msk-payment-container {
  max-width: 100%;
}

@media (max-width: 991px) {
  .msk-payment-container {
    padding: 12px 20px;
    max-width: 450px;
    margin: 0 auto;
  }
}

.msk-loading-state {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

@media (max-width: 991px) {
  .msk-loading-state {
    display: none !important;
  }
}

.msk-loading-spinner {
  width: 28px;
  height: 28px;
  border: 3px solid #f3f3f3;
  border-top: 3px solid #9ca3af;
  border-radius: 50%;
  animation: msk-spin 1s linear infinite;
}

@keyframes msk-spin {
  to { transform: rotate(360deg); }
}

/* ========== STRIPE NOT READY STATE ========== */
.msk-stripe-not-ready {
  display: none;
  text-align: center;
  padding: 40px 24px;
}

.msk-stripe-not-ready-icon {
  width: 64px;
  height: 64px;
  margin: 0 auto 20px;
  background: #FEF3C7;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.msk-stripe-not-ready-icon svg {
  width: 32px;
  height: 32px;
  color: #D97706;
}

.msk-stripe-not-ready-title {
  font-size: 18px;
  font-weight: 600;
  color: #1a1a1a;
  margin-bottom: 8px;
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.msk-stripe-not-ready-message {
  font-size: 14px;
  color: #6b7280;
  margin-bottom: 24px;
  line-height: 1.5;
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.msk-stripe-not-ready-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: #0570DE;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 14px 24px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  text-decoration: none;
  transition: all 0.2s ease;
}

.msk-stripe-not-ready-button:hover {
  background: #0461c4;
  transform: translateY(-1px);
}

.msk-stripe-not-ready-button svg {
  width: 16px;
  height: 16px;
}

/* ========== MOBILE COMPACT ========== */
.msk-mobile-compact {
  display: none;
  padding-bottom: 6px;
}

@media (max-width: 991px) {
  .msk-mobile-compact {
    display: block;
  }
}

.msk-compact-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.msk-compact-price {
  font-size: 28px;
  font-weight: 600;
  color: #1a1a1a;
  letter-spacing: -0.5px;
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.msk-compact-price .msk-price-before {
  font-size: 18px;
  font-weight: 500;
  color: #b0b0b0;
  text-decoration: line-through;
}

/* Pay with card button */
.msk-pay-card-btn {
  background: none;
  border: none;
  color: #0570DE;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: 4px 0;
  display: none;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

.msk-pay-card-btn:hover {
  text-decoration: underline;
}

.msk-pay-card-btn svg {
  width: 14px;
  height: 14px;
}

.msk-express-compact {
  display: none;
}

/* Mobile: Fixed height to show only 1 button, hide overflow (no "More" button) */
#express-checkout-element-compact {
  height: 54px;
  overflow: hidden;
}

.msk-fallback-button {
  display: none;
  width: 100%;
  height: 54px;
  background: #0570DE;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  align-items: center;
  justify-content: center;
}

.msk-fallback-button:active {
  background: #0461c4;
  transform: scale(0.98);
}

/* ========== MOBILE EXPANDED ========== */
.msk-mobile-expanded {
  display: none;
  padding-top: 6px;
  padding-bottom: 6px;
}

.msk-expanded-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-top: 0;
}

.msk-expanded-header-left {

  min-width: 0;

/* Seller name with "Pay" prefix - mobile expanded */

  font-weight: 500;
  color: #1a1a1a;

  align-items: center;
  gap: 4px;

  font-weight: 400;
}

.msk-expanded-seller .msk-seller-value {
  color: #0570DE;
  font-weight: 500;
}

.msk-close-button {

  border: none;
  font-size: 28px;
  color: #6b7280;

  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  margin-left: 12px;
  flex-shrink: 0;
}

.msk-email-section {

}

.msk-email-error.visible {

}

      email: 'メール',
      payNow: '支払う',
      processing: '処理中...',
      continueToPayment: '続ける',
      emailRequired: 'ファイル受取用メールを入力',
      emailInvalid: '有効なメールを入力',
      pay: '支払',
      stripeNotReadyTitle: '支払いが設定されていません',
      stripeNotReadyMessage: 'この販売者はまだ支払いアカウントの設定を完了していません。',
      stripeNotReadySellerMessage: '支払いアカウントの設定がまだ完了していません。',
      goToSettings: '設定へ移動'
    }
  };
  
  function detectLanguage() {
    const lang = (navigator.language || navigator.userLanguage || 'en').split('-')[0].toLowerCase();
    return TRANSLATIONS[lang] ? lang : 'en';
  }
  
  const currentLang = detectLanguage();
  const t = TRANSLATIONS[currentLang];
  
  // State
  let isMobile = window.innerWidth < 992;
  let isExpanded = false;
  let hasExpressPaymentMethods = false;
  let paymentElement = null;
  let expressCheckout = null;
  let customerEmail = '';
  let isProcessing = false;
  let expressReady = false;
  let availableExpressMethods = {};
  
  const $ = (id) => document.getElementById(id);
  
  function showError(msg, elementId) {
    const el = $(elementId);
    if (el) {
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 5000);
    }
  }
  
  function validateEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }
  
  function updateButtonText(amount) {
    const text = `${t.payNow} ${amount}`;
    const desktopText = $('msk-submit-text-desktop');
    const expandedText = $('msk-submit-text-expanded');
    if (desktopText) desktopText.textContent = text;
    if (expandedText) expandedText.textContent = text;
  }
  
  function setLoading(loading) {
    isProcessing = loading;
    const buttons = [$('msk-submit-desktop'), $('msk-submit-expanded')];
    const texts = [$('msk-submit-text-desktop'), $('msk-submit-text-expanded')];
    
    buttons.forEach((btn, i) => {
      if (!btn) return;
      if (loading) {
        btn.classList.add('msk-loading');
        if (texts[i]) texts[i].innerHTML = `<span class="msk-spinner"></span>${t.processing}`;
      } else {
        btn.classList.remove('msk-loading');
        updateButtonText(window.MySellKit?.amount || '');
      }
    });
  }
  
  function applyTranslations() {
    const payCardText = $('msk-pay-card-text');
    if (payCardText) payCardText.textContent = t.payWithCard;
    
    const separatorText = $('msk-separator-text');
    if (separatorText) separatorText.textContent = t.orPayWithCard;
    
    const fallbackBtn = $('msk-fallback-button');
    if (fallbackBtn) fallbackBtn.textContent = t.continueToPayment;
    
    const emailLabelDesktop = $('msk-email-label-desktop');
    if (emailLabelDesktop) emailLabelDesktop.textContent = t.email;
    
    const emailLabelExpanded = $('msk-email-label-expanded');
    if (emailLabelExpanded) emailLabelExpanded.textContent = t.email;
    
    // Stripe not ready translations
    const stripeNotReadyTitle = $('msk-stripe-not-ready-title');
    if (stripeNotReadyTitle) stripeNotReadyTitle.textContent = t.stripeNotReadyTitle;
    
    const stripeNotReadyMessage = $('msk-stripe-not-ready-message');
    if (stripeNotReadyMessage) stripeNotReadyMessage.textContent = t.stripeNotReadyMessage;
    
    const stripeNotReadyButtonText = $('msk-stripe-not-ready-button-text');
    if (stripeNotReadyButtonText) stripeNotReadyButtonText.textContent = t.goToSettings;
  }
  
  function updateSellerName(sellerName) {
    // Desktop
    const paidToDesktop = $('msk-paid-to-desktop');
    const sellerValueDesktop = $('msk-seller-value-desktop');
    const sellerDesktop = $('msk-seller-desktop');
    
    if (paidToDesktop && sellerValueDesktop && sellerDesktop && sellerName) {
      paidToDesktop.textContent = t.pay + ' ';
      sellerValueDesktop.textContent = sellerName;
      sellerDesktop.style.display = 'block';
    }
    
    // Mobile expanded
    const paidToMobile = $('msk-paid-to-mobile');
    const sellerValueMobile = $('msk-seller-value-mobile');
    const sellerMobile = $('msk-expanded-seller');
    
    if (paidToMobile && sellerValueMobile && sellerMobile && sellerName) {
      paidToMobile.textContent = t.pay + ' ';
      sellerValueMobile.textContent = sellerName;
      sellerMobile.style.display = 'flex';
    } else if (sellerMobile && !sellerName) {
      sellerMobile.style.display = 'none';
    }
  }
  
  function showStripeNotReady(settingsUrl) {
    const loading = $('msk-loading');
    const container = $('msk-container');
    const notReady = $('msk-stripe-not-ready');
    
    if (loading) loading.style.display = 'none';
    if (container) container.style.display = 'none';
    if (notReady) notReady.style.display = 'block';
    
    const button = $('msk-stripe-not-ready-button');
    if (button && settingsUrl) {
      button.href = settingsUrl;
    }
    
    log.info('Showing Stripe not ready state');
  }
  
  // Move Express Checkout element between mobile and desktop containers
  function moveExpressCheckout() {
    const expressEl = $('express-checkout-element');
    const mobileContainer = $('express-checkout-element-compact');
    const desktopContainer = $('msk-express-desktop');
    
    if (!expressEl) return;
    
    if (isMobile && mobileContainer) {
      // Move to mobile container
      if (expressEl.parentNode !== mobileContainer) {
        mobileContainer.appendChild(expressEl);
      }
    } else if (desktopContainer) {
      // Move back to desktop container (default position)
      const desktopExpressWrapper = desktopContainer;
      if (expressEl.parentNode !== desktopExpressWrapper) {
        // Check if it's the first child or needs to be placed correctly
        if (desktopExpressWrapper.firstChild !== expressEl) {
          desktopExpressWrapper.insertBefore(expressEl, desktopExpressWrapper.firstChild);
        }
      }
    }
  }
  
  function updateMobileCompactState() {
    if (!isMobile || !expressReady) return;
    
    const expressCompact = $('msk-express-compact');
    const fallback = $('msk-fallback-button');
    const payCardBtn = $('msk-pay-card-btn');
    
    // Re-check available methods to be safe
    const hasExpress = !!(
      availableExpressMethods.applePay || 
      availableExpressMethods.googlePay || 
      availableExpressMethods.link
    );
    
    if (hasExpress) {
      if (expressCompact) expressCompact.style.display = 'block';
      if (fallback) fallback.style.display = 'none';
      if (payCardBtn) payCardBtn.style.display = 'flex';
    } else {
      // No express methods available - show fallback button
      if (expressCompact) expressCompact.style.display = 'none';
      if (fallback) fallback.style.display = 'flex';
      if (payCardBtn) payCardBtn.style.display = 'none';
      log.info('No express methods available, showing fallback button');
    }
  }
  
  function setMobileCompact() {
    if (!isMobile) return;
    isExpanded = false;
    
    const compact = $('msk-mobile-compact');
    const expanded = $('msk-mobile-expanded');
    const desktop = $('msk-desktop');
    
    if (compact) compact.style.display = 'block';
    if (expanded) expanded.style.display = 'none';
    if (desktop) desktop.style.display = 'none';
    
    // Move express checkout to mobile
    moveExpressCheckout();
    
    if (!expressReady) {
      const expressCompact = $('msk-express-compact');
      const fallback = $('msk-fallback-button');
      const payCardBtn = $('msk-pay-card-btn');
      if (expressCompact) expressCompact.style.display = 'none';
      if (fallback) fallback.style.display = 'none';
      if (payCardBtn) payCardBtn.style.display = 'none';
      return;
    }
    
    updateMobileCompactState();
  }
  
  function setMobileExpanded() {
    if (!isMobile) return;
    
    isExpanded = true;
    
    const compact = $('msk-mobile-compact');
    const expanded = $('msk-mobile-expanded');
    const desktop = $('msk-desktop');
    
    if (compact) compact.style.display = 'none';
    if (expanded) expanded.style.display = 'block';
    if (desktop) desktop.style.display = 'none';
    
    const paymentEl = $('payment-element');
    const expandedContainer = $('payment-element-expanded');
    if (paymentEl && expandedContainer && paymentEl.parentNode !== expandedContainer) {
      expandedContainer.appendChild(paymentEl);
    }
  }
  
  function setDesktopLayout() {
    const compact = $('msk-mobile-compact');
    const expanded = $('msk-mobile-expanded');
    const desktop = $('msk-desktop');
    
    if (compact) compact.style.display = 'none';
    if (expanded) expanded.style.display = 'none';
    if (desktop) desktop.style.display = 'block';
    
    // Move express checkout back to desktop
    moveExpressCheckout();
    
    const paymentEl = $('payment-element');
    const desktopPaymentContainer = $('payment-element-desktop-wrapper');
    if (paymentEl && desktopPaymentContainer && paymentEl.parentNode !== desktopPaymentContainer) {
      desktopPaymentContainer.appendChild(paymentEl);
    }
    
    const express = $('msk-express-desktop');
    const separator = $('msk-separator-desktop');
    
    if (hasExpressPaymentMethods && expressReady) {
      if (express) express.style.display = 'block';
      if (separator) separator.style.display = 'flex';
    } else {
      if (express) express.style.display = 'none';
      if (separator) separator.style.display = 'none';
    }
  }
  
  async function handleSubmit(emailInputId, messageId) {
    if (isProcessing) return;
    
    const emailInput = $(emailInputId);
    const email = emailInput ? emailInput.value.trim() : customerEmail;
    
    if (!email) {
      showError(t.emailRequired, messageId);
      if (emailInput) emailInput.focus();
      return;
    }
    if (!validateEmail(email)) {
      showError(t.emailInvalid, messageId);
      if (emailInput) emailInput.focus();
      return;
    }
    
    setLoading(true);
    
    const emailResult = await window.MySellKit.updateEmail(email);
    if (emailResult.type === 'error') {
      showError(emailResult.error.message, messageId);
      setLoading(false);
      return;
    }
    
    const { error } = await window.MySellKit.confirmPayment(email);
    
    if (error) {
      showError(error.message, messageId);
      setLoading(false);
    }
  }
  
  async function handleEmailBlur(emailInputId) {
    const input = $(emailInputId);
    if (!input || !input.value.trim()) return;
    
    const email = input.value.trim();
    if (!validateEmail(email)) return;
    
    customerEmail = email;
    
    if (window.MySellKit?.updateEmail) {
      await window.MySellKit.updateEmail(email);
    }
  }
  
  // Apply translations immediately
  applyTranslations();
  
  // Handle Stripe not ready event
  window.addEventListener('mysellkit:stripe-not-ready', function(e) {
    const detail = e.detail || {};
    showStripeNotReady(detail.settingsUrl);
  });
  
  window.addEventListener('mysellkit:ready', function(e) {
    const detail = e.detail || {};
    
    const loading = $('msk-loading');
    const container = $('msk-container');
    
    if (loading) loading.style.display = 'none';
    if (!isMobile && container) container.style.display = 'block';
    
    const amount = detail.amount || window.MySellKit?.amount || '';
    const priceBefore = detail.priceBefore || window.MySellKit?.priceBefore || '';
    const sellerName = detail.sellerName || window.MySellKit?.sellerName || '';
    
    let priceHTML = `<span>${amount}</span>`;
    if (priceBefore) priceHTML += `<span class="msk-price-before">${priceBefore}</span>`;
    
    const priceCompact = $('msk-price-compact');
    const priceDesktop = $('msk-price-desktop');
    if (priceCompact) priceCompact.innerHTML = priceHTML;
    if (priceDesktop) priceDesktop.innerHTML = priceHTML;
    
    // Update seller name with "Paid to" prefix
    updateSellerName(sellerName);
    
    updateButtonText(amount);
    
    const checkout = window.MySellKit.checkout;
    if (!checkout) return;
    
    // Payment Element - Card only, no Link, no wallets
    paymentElement = checkout.createPaymentElement({
      layout: { type: 'tabs', defaultCollapsed: false },
      fields: { billingDetails: { email: 'never', address: 'never' } },
      wallets: { applePay: 'never', googlePay: 'never', link: 'never' }
    });
    
    paymentElement.mount('#payment-element');
    
    // Express Checkout Element - Apple Pay + Link
    // Always mount to desktop container first, then move via JS/CSS
    expressCheckout = checkout.createExpressCheckoutElement({
      buttonHeight: 54,
      buttonType: { applePay: 'plain' },
      buttonTheme: { applePay: 'black' },
      paymentMethods: {
        applePay: 'always',
        googlePay: 'auto',
        link: 'auto',
        amazonPay: 'never',
        paypal: 'never',
        klarna: 'never'
      },
      layout: { maxColumns: 1, maxRows: 2 }
    });
    
    // Always mount to desktop container
    expressCheckout.mount('#express-checkout-element');
    
    expressCheckout.on('ready', ({ availablePaymentMethods }) => {
      expressReady = true;
      availableExpressMethods = availablePaymentMethods || {};
      // Check ALL express payment methods, not just Apple Pay and Link
      hasExpressPaymentMethods = !!(
        availableExpressMethods.applePay || 
        availableExpressMethods.googlePay || 
        availableExpressMethods.link
      );
      
      log.info('Express Checkout ready');
      log.info('Available methods:', JSON.stringify(availableExpressMethods));
      log.info('Has express methods:', hasExpressPaymentMethods);
      
      if (isMobile) {
        const container = $('msk-container');
        if (container) container.style.display = 'block';
        setMobileCompact();
        log.info('Layout: Mobile Compact');
      } else {
        setDesktopLayout();
        log.info('Layout: Desktop');
      }
      
      // Notify B4Body that checkout is fully ready for tracking
      if (window.MySellKit?.onCheckoutReady) {
        window.MySellKit.onCheckoutReady();
      }
    });
    
    // Handle Express Checkout confirm (Apple Pay or Link)
    expressCheckout.on('confirm', async (event) => {
      log.info('Express Checkout confirm event:', event.expressPaymentType);
      
      if (window.MySellKit?.actions) {
        const result = await window.MySellKit.actions.confirm({
          expressCheckoutConfirmEvent: event
        });
        
        if (result.type === 'error') {
          log.error('Express payment failed:', result.error.message);
          showError(result.error.message, isMobile ? 'msk-message-expanded' : 'msk-message-desktop');
        } else {
          log.success('Express payment confirmed');
          if (window.MySellKit?.markPurchaseComplete) {
            window.MySellKit.markPurchaseComplete();
          }
        }
      }
    });
    
    // Handle cancel from Express Checkout
    expressCheckout.on('cancel', () => {
      log.info('Express checkout cancelled by user');
    });
    
    // Event listeners
    const payCardBtn = $('msk-pay-card-btn');
    if (payCardBtn) {
      payCardBtn.addEventListener('click', () => {
        setMobileExpanded();
      });
    }
    
    const fallback = $('msk-fallback-button');
    if (fallback) {
      fallback.addEventListener('click', () => {
        setMobileExpanded();
      });
    }
    
    const closeBtn = $('msk-close-button');
    if (closeBtn) closeBtn.addEventListener('click', () => setMobileCompact());
    
    const submitDesktop = $('msk-submit-desktop');
    if (submitDesktop) submitDesktop.addEventListener('click', (e) => { e.preventDefault(); handleSubmit('msk-email-desktop', 'msk-message-desktop'); });
    
    const submitExpanded = $('msk-submit-expanded');
    if (submitExpanded) submitExpanded.addEventListener('click', (e) => { e.preventDefault(); handleSubmit('msk-email-expanded', 'msk-message-expanded'); });
    
    const emailDesktop = $('msk-email-desktop');
    if (emailDesktop) {
      emailDesktop.addEventListener('blur', () => handleEmailBlur('msk-email-desktop'));
      emailDesktop.addEventListener('input', () => { emailDesktop.classList.remove('msk-error'); });
    }
    
    const emailExpanded = $('msk-email-expanded');
    if (emailExpanded) {
      emailExpanded.addEventListener('blur', () => handleEmailBlur('msk-email-expanded'));
      emailExpanded.addEventListener('input', () => { emailExpanded.classList.remove('msk-error'); });
    }
  });
  
  window.addEventListener('mysellkit:error', () => {
    showError('Failed to load. Please refresh.', 'msk-message-desktop');
  });
  
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const newMobile = window.innerWidth < 992;
      if (newMobile !== isMobile && expressReady) {
        isMobile = newMobile;
        if (newMobile) setMobileCompact();
        else setDesktopLayout();
      }
    }, 300);
  });
  
})();
</script>
