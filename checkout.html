.msk-payment-embed {

}

    width: calc(100% - 96px);

  }
}

  .msk-payment-embed {
    margin: 0 auto;
    width: 100%;
    max-width: 100%;

}

.msk-payment-embed *,

.msk-payment-embed *::after {

}

.msk-payment-container {
  max-width: 100%;

  function detectLanguage() {
    const lang = (navigator.language || navigator.userLanguage || 'en').split('-')[0].toLowerCase();
    return TRANSLATIONS[lang] ? lang : 'en';
  }

  function setLanguage(lang) {
    const normalizedLang = (lang || '').split('-')[0].toLowerCase();
    if (TRANSLATIONS[normalizedLang]) {
      currentLang = normalizedLang;
      t = TRANSLATIONS[currentLang];
      applyTranslations();
      return true;
    }
    return false;
  }

  let currentLang = detectLanguage();
  let t = TRANSLATIONS[currentLang];
  
  // State
  let isMobile = window.innerWidth < 992;

  const $ = (id) => document.getElementById(id);
  
  function showError(msg, elementId) {
    const el = $(elementId);
    if (el) {
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 5000);
    }
  }
  
  function validateEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }
  
  function updateButtonText(amount) {
    const text = `${t.payNow} ${amount}`;
    const desktopText = $('msk-submit-text-desktop');
    const expandedText = $('msk-submit-text-expanded');
    if (desktopText) desktopText.textContent = text;
    if (expandedText) expandedText.textContent = text;
  }
  
  function setLoading(loading) {
    isProcessing = loading;
    const buttons = [$('msk-submit-desktop'), $('msk-submit-expanded')];
    const texts = [$('msk-submit-text-desktop'), $('msk-submit-text-expanded')];
    
    buttons.forEach((btn, i) => {
      if (!btn) return;
      if (loading) {
        btn.classList.add('msk-loading');
        if (texts[i]) texts[i].innerHTML = `<span class="msk-spinner"></span>${t.processing}`;
      } else {
        btn.classList.remove('msk-loading');
        updateButtonText(window.MySellKit?.amount || '');
      }
    });
  }
  
  function applyTranslations() {
    const separatorText = $('msk-separator-text');
    if (separatorText) separatorText.textContent = t.orPayWithCard;

    const separatorMobile = $('msk-separator-text-mobile');
    if (separatorMobile) separatorMobile.textContent = t.orPayWithCard;

    const emailLabelDesktop = $('msk-email-label-desktop');
    if (emailLabelDesktop) emailLabelDesktop.textContent = t.email;

    const emailLabelExpanded = $('msk-email-label-expanded');
    if (emailLabelExpanded) emailLabelExpanded.textContent = t.email;

    const ctaButton = $('msk-compact-cta-text');
    if (ctaButton) ctaButton.textContent = t.ctaButton;

    // Stripe not ready translations
    const stripeNotReadyTitle = $('msk-stripe-not-ready-title');
    if (stripeNotReadyTitle) stripeNotReadyTitle.textContent = t.stripeNotReadyTitle;

    const stripeNotReadyMessage = $('msk-stripe-not-ready-message');
    if (stripeNotReadyMessage) stripeNotReadyMessage.textContent = t.stripeNotReadyMessage;

    const stripeNotReadyButtonText = $('msk-stripe-not-ready-button-text');
    if (stripeNotReadyButtonText) stripeNotReadyButtonText.textContent = t.goToSettings;
  }
  
  function updateSellerName(sellerName, sellerAvatar) {
    // Desktop
    const paidToDesktop = $('msk-paid-to-desktop');
    const sellerValueDesktop = $('msk-seller-value-desktop');
    const sellerDesktop = $('msk-seller-desktop');
    const avatarDesktop = $('msk-seller-avatar-desktop');

    if (paidToDesktop && sellerValueDesktop && sellerDesktop && sellerName) {
      paidToDesktop.textContent = t.pay + ' ';
      sellerValueDesktop.textContent = sellerName;

      // Handle avatar
      if (avatarDesktop && sellerAvatar) {
        avatarDesktop.src = sellerAvatar;
        avatarDesktop.style.display = 'block';
        sellerDesktop.classList.add('msk-has-avatar');
        sellerDesktop.style.display = 'flex';
      } else {
        if (avatarDesktop) avatarDesktop.style.display = 'none';
        sellerDesktop.style.display = 'block';
      }
    }

    // Mobile expanded header
    const expandedSeller = $('msk-expanded-seller');
    const expandedAvatar = $('msk-expanded-avatar');
    const expandedPaidTo = $('msk-expanded-paid-to');
    const expandedSellerName = $('msk-expanded-seller-name');

    if (expandedSeller && expandedPaidTo && expandedSellerName && sellerName) {
      expandedPaidTo.textContent = t.pay + ' ';
      expandedSellerName.textContent = sellerName;

      if (expandedAvatar && sellerAvatar) {
        expandedAvatar.src = sellerAvatar;
        expandedSeller.classList.add('msk-visible');
      } else {
        if (expandedAvatar) expandedAvatar.style.display = 'none';
        expandedSeller.classList.add('msk-visible');
      }
    }
  }

  // Update mobile compact left side: seller info OR social proof
  function updateMobileCompactLeft(sellerName, sellerAvatar, reviewsCount, reviewsAverage) {
    const compactSeller = $('msk-compact-seller');
    const compactSellerAvatar = $('msk-compact-seller-avatar');
    const compactSellerName = $('msk-compact-seller-name');
    const compactSocialProof = $('msk-compact-social-proof');
    const compactRating = $('msk-compact-rating');
    const compactReviewsCount = $('msk-compact-reviews-count');

    // Check if we have reviews
    const hasReviews = reviewsCount && reviewsCount > 0;

    if (hasReviews && compactSocialProof) {
      // Show social proof
      if (compactSeller) compactSeller.classList.remove('msk-visible');
      compactSocialProof.classList.add('msk-visible');

      // Format rating (show 1 decimal if needed, e.g., 4.8)
      const rating = parseFloat(reviewsAverage) || 5;
      const formattedRating = rating % 1 === 0 ? rating.toFixed(0) : rating.toFixed(1);
      if (compactRating) compactRating.textContent = formattedRating;
      if (compactReviewsCount) compactReviewsCount.textContent = reviewsCount + ' ' + t.reviews;

      // Add click handler to scroll to reviews section
      compactSocialProof.onclick = function() {
        scrollToReviews();
      };

      log.info('Mobile compact: showing social proof -', reviewsCount, 'reviews, avg:', formattedRating);
    } else if (sellerName && sellerAvatar && compactSeller) {
      // Show seller info (only if we have avatar)
      if (compactSocialProof) compactSocialProof.classList.remove('msk-visible');
      compactSeller.classList.add('msk-visible');

      if (compactSellerAvatar) compactSellerAvatar.src = sellerAvatar;
      if (compactSellerName) compactSellerName.textContent = sellerName;

      log.info('Mobile compact: showing seller info -', sellerName);
    } else {
      // Hide both if no data
      if (compactSeller) compactSeller.classList.remove('msk-visible');
      if (compactSocialProof) compactSocialProof.classList.remove('msk-visible');
      log.info('Mobile compact: no seller/reviews data, hiding left side');
    }
  }

  // Scroll to reviews section
  function scrollToReviews() {
    // Try to find the reviews section in the content area
    const reviewsSection = document.querySelector('.msk-reviews-section') ||
                          document.getElementById('msk-reviews') ||
                          document.querySelector('[id*="reviews"]');

    if (reviewsSection) {
      reviewsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      log.info('Scrolled to reviews section');
    } else {
      log.warn('Reviews section not found for scroll');
    }
  }
  
  function showStripeNotReady(settingsUrl) {
    const loading = $('msk-loading');
    const container = $('msk-container');
    const notReady = $('msk-stripe-not-ready');
    
    if (loading) loading.style.display = 'none';
    if (container) container.style.display = 'none';
    if (notReady) notReady.style.display = 'block';
    
    const button = $('msk-stripe-not-ready-button');
    if (button && settingsUrl) {
      button.href = settingsUrl;
    }
    
    log.info('Showing Stripe not ready state');
  }
  
  // Move Express Checkout element between mobile expanded and desktop containers
  // Note: Only move to mobile when panel is truly visible (isExpanded), not in preload state
  // because Stripe cannot calculate dimensions when container has visibility:hidden
  function moveExpressCheckout() {
    const expressEl = $('express-checkout-element');
    const mobileContainer = $('express-checkout-element-mobile');
    const desktopContainer = $('msk-express-desktop');

    if (!expressEl) return;

    if (isMobile && isExpanded && mobileContainer) {
      // Move to mobile expanded container (only when truly visible)
      if (expressEl.parentNode !== mobileContainer) {
        mobileContainer.appendChild(expressEl);
      }
    } else if (!isMobile && desktopContainer) {
      // Move back to desktop container
      const wrapper = desktopContainer;
      if (expressEl.parentNode !== wrapper) {
        wrapper.insertBefore(expressEl, wrapper.firstChild);
      }
    }
  }
  
  let expandedOpenedAt = 0;

  function setMobileCompact() {
    if (!isMobile) return;
    // Prevent closing within 300ms of opening (fixes first-click bug)
    if (Date.now() - expandedOpenedAt < 300) return;
    isExpanded = false;

    const compact = $('msk-mobile-compact');
    const expanded = $('msk-mobile-expanded');
    const desktop = $('msk-desktop');

    if (compact) compact.style.display = 'block';
    if (expanded) {
      expanded.classList.remove('msk-preload');
      expanded.classList.add('msk-hidden');
    }
    if (desktop) desktop.style.display = 'none';
  }

  function setMobileExpanded() {
    if (!isMobile) return;
    expandedOpenedAt = Date.now();
    isExpanded = true;

    const compact = $('msk-mobile-compact');
    const expanded = $('msk-mobile-expanded');
    const desktop = $('msk-desktop');

    if (compact) compact.style.display = 'none';
    if (expanded) {
      expanded.classList.remove('msk-hidden', 'msk-preload');
    }
    if (desktop) desktop.style.display = 'none';

    // Move payment element to expanded container
    const paymentEl = $('payment-element');
    const expandedContainer = $('payment-element-expanded');
    if (paymentEl && expandedContainer && paymentEl.parentNode !== expandedContainer) {
      expandedContainer.appendChild(paymentEl);
    }

    // Move express checkout element to mobile expanded container
    moveExpressCheckout();

    // Show/hide express section based on availability
    const expressSection = $('msk-express-section-mobile');
    const separatorMobile = $('msk-separator-mobile');

    if (hasExpressPaymentMethods && expressReady) {
      if (expressSection) expressSection.style.display = 'block';
      if (separatorMobile) separatorMobile.style.display = 'flex';
    } else {
      if (expressSection) expressSection.style.display = 'none';
      if (separatorMobile) separatorMobile.style.display = 'none';
    }
  }
  
  function setDesktopLayout() {
    isExpanded = false;

    const compact = $('msk-mobile-compact');
    const expanded = $('msk-mobile-expanded');
    const desktop = $('msk-desktop');

    if (compact) compact.style.display = 'none';
    if (expanded) expanded.style.display = 'none';
    if (desktop) desktop.style.display = 'block';

    // Move express checkout back to desktop
    moveExpressCheckout();

    // Move payment element back to desktop
    const paymentEl = $('payment-element');
    const desktopPaymentContainer = $('payment-element-desktop-wrapper');
    if (paymentEl && desktopPaymentContainer && paymentEl.parentNode !== desktopPaymentContainer) {
      desktopPaymentContainer.appendChild(paymentEl);
    }

    const express = $('msk-express-desktop');
    const separator = $('msk-separator-desktop');

    if (hasExpressPaymentMethods && expressReady) {
      if (express) express.style.display = 'block';
      if (separator) separator.style.display = 'flex';
    } else {
      if (express) express.style.display = 'none';
      if (separator) separator.style.display = 'none';
    }
  }
  
  async function handleSubmit(emailInputId, messageId) {
    if (isProcessing) return;
    
    const emailInput = $(emailInputId);
    const email = emailInput ? emailInput.value.trim() : customerEmail;
    
    if (!email) {
      showError(t.emailRequired, messageId);
      if (emailInput) emailInput.focus();
      return;
    }
    if (!validateEmail(email)) {
      showError(t.emailInvalid, messageId);
      if (emailInput) emailInput.focus();
      return;
    }
    
    setLoading(true);
    
    const emailResult = await window.MySellKit.updateEmail(email);
    if (emailResult.type === 'error') {
      showError(emailResult.error.message, messageId);
      setLoading(false);
      return;
    }
    
    const { error } = await window.MySellKit.confirmPayment(email);
    
    if (error) {
      showError(error.message, messageId);
      setLoading(false);
    }
  }
  
  async function handleEmailBlur(emailInputId) {
    const input = $(emailInputId);
    if (!input || !input.value.trim()) return;
    
    const email = input.value.trim();
    if (!validateEmail(email)) return;
    
    customerEmail = email;
    
    if (window.MySellKit?.updateEmail) {
      await window.MySellKit.updateEmail(email);
    }
  }
  
  // Apply translations immediately
  applyTranslations();
  
  // Handle Stripe not ready event
  window.addEventListener('mysellkit:stripe-not-ready', function(e) {
    const detail = e.detail || {};
    showStripeNotReady(detail.settingsUrl);
  });
  
  window.addEventListener('mysellkit:ready', function(e) {
    const detail = e.detail || {};

    // Set language from API if provided (e.g., "fr", "en", "es")
    if (detail.language) {
      setLanguage(detail.language);
    }

    const loading = $('msk-loading');
    const container = $('msk-container');

    // Show container immediately - Stripe has its own loading animations
    if (loading) loading.style.display = 'none';
    if (container) container.style.display = 'block';

    // Set initial layout immediately
    if (isMobile) {
      setMobileCompact();
      // Preload expanded panel (off-screen) so Stripe elements load smoothly
      const expanded = $('msk-mobile-expanded');
      if (expanded) {
        expanded.classList.remove('msk-hidden');
        expanded.classList.add('msk-preload');
      }
    } else {
      setDesktopLayout();
    }
    
    const amount = detail.amount || window.MySellKit?.amount || '';
    const priceBefore = detail.priceBefore || window.MySellKit?.priceBefore || '';
    const sellerName = detail.sellerName || window.MySellKit?.sellerName || '';
    const sellerAvatar = detail.sellerAvatar || window.MySellKit?.sellerAvatar || '';
    const reviewsCount = detail.reviewsCount || window.MySellKit?.reviewsCount || 0;
    const reviewsAverage = detail.reviewsAverage || window.MySellKit?.reviewsAverage || 0;

    let priceHTML = `<span>${amount}</span>`;
    if (priceBefore) priceHTML += `<span class="msk-price-before">${priceBefore}</span>`;

    const priceCompact = $('msk-price-compact');
    const priceDesktop = $('msk-price-desktop');
    if (priceCompact) priceCompact.innerHTML = priceHTML;
    if (priceDesktop) priceDesktop.innerHTML = priceHTML;

    // Update seller name with avatar and "Pay" prefix
    updateSellerName(sellerName, sellerAvatar);

    // Update mobile compact left side (seller info or social proof)
    updateMobileCompactLeft(sellerName, sellerAvatar, reviewsCount, reviewsAverage);

    updateButtonText(amount);
    
    const checkout = window.MySellKit.checkout;
    if (!checkout) return;
    
    // Payment Element - Card only, no Link, no wallets
    paymentElement = checkout.createPaymentElement({
      layout: { type: 'tabs', defaultCollapsed: false },
      fields: { billingDetails: { email: 'never', address: 'never' } },
      wallets: { applePay: 'never', googlePay: 'never', link: 'never' }
    });
    
    paymentElement.mount('#payment-element');

    // On mobile, move payment element to expanded container for preloading
    if (isMobile) {
      const paymentEl = $('payment-element');
      const expandedContainer = $('payment-element-expanded');
      if (paymentEl && expandedContainer) {
        expandedContainer.appendChild(paymentEl);
      }
    }

    // Express Checkout Element - Apple Pay + Google Pay + Link
    // Always mount to desktop container first, then move via JS/CSS
    expressCheckout = checkout.createExpressCheckoutElement({
      buttonHeight: 54,
      buttonType: { applePay: 'plain' },
      buttonTheme: { applePay: 'black' },
      paymentMethods: {
        applePay: 'always',
        googlePay: 'auto',
        link: 'auto',
        amazonPay: 'never',
        paypal: 'never',
        klarna: 'auto'
      },
      layout: { maxColumns: 1, maxRows: 2 }
    });

    // Add loading class to hide express checkout during resource loading
    const expressDesktop = $('msk-express-desktop');
    const expressMobile = $('msk-express-section-mobile');
    if (expressDesktop) expressDesktop.classList.add('msk-express-loading');
    if (expressMobile) expressMobile.classList.add('msk-express-loading');

    // Always mount to desktop container
    expressCheckout.mount('#express-checkout-element');
    
    expressCheckout.on('ready', ({ availablePaymentMethods }) => {
      expressReady = true;
      availableExpressMethods = availablePaymentMethods || {};
      // Check ALL express payment methods
      hasExpressPaymentMethods = !!(
        availableExpressMethods.applePay ||
        availableExpressMethods.googlePay ||
        availableExpressMethods.link ||
        availableExpressMethods.klarna
      );

      log.info('Express Checkout ready');
      log.info('Available methods:', JSON.stringify(availableExpressMethods));
      log.info('Has express methods:', hasExpressPaymentMethods);

      // Remove loading class after a short delay to ensure buttons are fully rendered
      setTimeout(() => {
        const expressDesktopEl = $('msk-express-desktop');
        const expressMobileEl = $('msk-express-section-mobile');
        if (expressDesktopEl) expressDesktopEl.classList.remove('msk-express-loading');
        if (expressMobileEl) expressMobileEl.classList.remove('msk-express-loading');
      }, 150);

      // Move express checkout to correct container based on current layout
      // (only moves to mobile if panel is truly expanded, not in preload)
      moveExpressCheckout();

      // Update express section visibility for desktop
      const express = $('msk-express-desktop');
      const separator = $('msk-separator-desktop');

      if (hasExpressPaymentMethods) {
        if (express) express.style.display = 'block';
        if (separator) separator.style.display = 'flex';
      } else {
        if (express) express.style.display = 'none';
        if (separator) separator.style.display = 'none';
      }

      // Update express section visibility for mobile (only if truly expanded)
      if (isMobile && isExpanded) {
        const expressMobile = $('msk-express-section-mobile');
        const separatorMobile = $('msk-separator-mobile');

        if (hasExpressPaymentMethods) {
          if (expressMobile) expressMobile.style.display = 'block';
          if (separatorMobile) separatorMobile.style.display = 'flex';
        } else {
          if (expressMobile) expressMobile.style.display = 'none';
          if (separatorMobile) separatorMobile.style.display = 'none';
        }
      }

      // Notify B4Body that checkout is fully ready for tracking
      if (window.MySellKit?.onCheckoutReady) {
        window.MySellKit.onCheckoutReady();
      }
    });
    
    // Handle Express Checkout confirm (Apple Pay, Google Pay, or Link)
    expressCheckout.on('confirm', async (event) => {
      log.info('Express Checkout confirm event:', event.expressPaymentType);
      
      if (window.MySellKit?.actions) {
        const result = await window.MySellKit.actions.confirm({
          expressCheckoutConfirmEvent: event
        });
        
        if (result.type === 'error') {
          log.error('Express payment failed:', result.error.message);
          showError(result.error.message, isMobile ? 'msk-message-expanded' : 'msk-message-desktop');
        } else {
          log.success('Express payment confirmed');
          if (window.MySellKit?.markPurchaseComplete) {
            window.MySellKit.markPurchaseComplete();
          }
        }
      }
    });
    
    // Handle cancel from Express Checkout
    expressCheckout.on('cancel', () => {
      log.info('Express checkout cancelled by user');
    });
    
    // Event listeners
    const ctaBtn = $('msk-compact-cta-button');
    if (ctaBtn) {
      ctaBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        setMobileExpanded();
      });
    }

    const closeBtn = $('msk-close-button');
    if (closeBtn) {
      closeBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        setMobileCompact();
      });
    }
    
    const submitDesktop = $('msk-submit-desktop');
    if (submitDesktop) submitDesktop.addEventListener('click', (e) => { e.preventDefault(); handleSubmit('msk-email-desktop', 'msk-message-desktop'); });
    
    const submitExpanded = $('msk-submit-expanded');
    if (submitExpanded) submitExpanded.addEventListener('click', (e) => { e.preventDefault(); handleSubmit('msk-email-expanded', 'msk-message-expanded'); });
    
    const emailDesktop = $('msk-email-desktop');
    if (emailDesktop) {
      emailDesktop.addEventListener('blur', () => handleEmailBlur('msk-email-desktop'));
      emailDesktop.addEventListener('input', () => { emailDesktop.classList.remove('msk-error'); });
    }
    
    const emailExpanded = $('msk-email-expanded');
    if (emailExpanded) {
      emailExpanded.addEventListener('blur', () => handleEmailBlur('msk-email-expanded'));
      emailExpanded.addEventListener('input', () => { emailExpanded.classList.remove('msk-error'); });
    }
  });
  
  window.addEventListener('mysellkit:error', () => {
    showError('Failed to load. Please refresh.', 'msk-message-desktop');
  });
  
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const newMobile = window.innerWidth < 992;
      if (newMobile !== isMobile) {
        isMobile = newMobile;
        if (newMobile) {
          setMobileCompact();
          // Prepare expanded panel for preloading (same as initial mobile setup)
          const expanded = $('msk-mobile-expanded');
          if (expanded) {
            expanded.classList.remove('msk-hidden');
            expanded.classList.add('msk-preload');
          }
          // Move payment element to expanded container for preloading
          // Note: Express Checkout stays in desktop container until panel is truly opened
          // because Stripe cannot calculate dimensions when container has visibility:hidden
          const paymentEl = $('payment-element');
          const expandedContainer = $('payment-element-expanded');
          if (paymentEl && expandedContainer && paymentEl.parentNode !== expandedContainer) {
            expandedContainer.appendChild(paymentEl);
          }
        } else {
          setDesktopLayout();
        }
      }
    }, 300);
  });
  
})();
</script>
